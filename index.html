  <script>
    // Registro do service worker (offline). Falhas são silenciosas.
    try {
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          try { navigator.serviceWorker.register('sw.js').catch(function () {}); } catch (e) {}
        });
      }
    } catch (e) {}
  </script>
